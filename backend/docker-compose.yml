# Local PostgreSQL 16 for development:  docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ilmgo
      POSTGRES_PASSWORD: ilmgo
      POSTGRES_DB: ilmgo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ilmgo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ilmgo -d ilmgo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ilmgo-db:
